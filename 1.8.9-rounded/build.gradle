plugins {
	id 'java'
	id "fabric-loom"
	id 'ploceus'
}

group = maven_group
version = "${project.version}+${project.minecraft_18}"
base.archivesName = "AxolotlClient-config-rounded"

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	maven {
		url = "https://moehreag.duckdns.org/maven/releases"
	}
	mavenLocal()
	mavenCentral()
}

loom {
	mods {
		"axolotlclientconfig" {
			sourceSet("main")
		}
		"axolotlclientconfig-test" {
			sourceSet("test")
		}
	}

	runs {
		named("client") {
			it.source(sourceSets.getByName("test"))
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_18}"
	mappings "net.ornithemc:feather:${project.mappings_18}"

	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader}"

	ploceus.dependOsl(osl)

	modImplementation("com.terraformersmc:modmenu:0.3.1+mc1.8.9")

	implementation project(":common")
	implementation include(project(":common-rounded"))
	implementation project(path: ":1.8.9-vanilla", configuration: "namedElements")

	modImplementation("io.github.moehreag:legacy-lwjgl3:$legacy_lwjgl3+${project.minecraft_18}")

	def lwjglVersion = "3.3.6"
	api include("org.lwjgl:lwjgl-nanovg:$lwjglVersion")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-linux")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-linux-arm64")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-windows")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-windows-arm64")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-macos")
	include runtimeOnly("org.lwjgl:lwjgl-nanovg:$lwjglVersion:natives-macos-arm64")
}

configurations.configureEach {
	exclude(group: "org.lwjgl.lwjgl")
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand "version": version
	}
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}

	repositories {
		maven {
			name = "owlMaven"
			def repository = project.version.toString().contains("beta") || project.version.toString().contains("alpha") ? "snapshots" : "releases"
			url = "https://moehreag.duckdns.org/maven/" + repository
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}
