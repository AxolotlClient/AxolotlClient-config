plugins {
	id 'java'
	id "fabric-loom"
}

group = maven_group
version = "${project.version}+${project.minecraft_121}"
archivesBaseName = "AxolotlClient-config"

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
	maven {
		url = "https://moehreag.duckdns.org/maven/releases"
	}
	maven {
		url = "https://maven.terraformersmc.com/releases"
	}
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release'
	}
	mavenLocal()
}

loom {
	mods {
		"axolotlclientconfig" {
			sourceSet("main")
		}
		"axolotlclientconfig-test" {
			sourceSet("test")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_121}"
	mappings "org.quiltmc:quilt-mappings:${project.mappings_121}:intermediary-v2"

	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader}"

	modApi "net.fabricmc.fabric-api:fabric-api:${project.fapi_121}+${project.minecraft_121}"

	modCompileOnlyApi("com.terraformersmc:modmenu:6.1.0-beta.3") {
		transitive = false
	}

	implementation include(project(":common"))

	include implementation("org.lwjgl:lwjgl-nanovg:3.3.3")
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-linux')
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-linux-arm64')
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-windows')
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-windows-arm64')
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-macos')
	include runtimeOnly('org.lwjgl:lwjgl-nanovg:3.3.3:natives-macos-arm64')
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand "version": version
	}
}

afterEvaluate {
	tasks.runClient {
		classpath(sourceSets.test.runtimeClasspath)
	}
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = archivesBaseName
			from components.java
		}
	}

	repositories {
		maven {
			name = "owlMaven"
			def repository = project.version.toString().contains("beta") || project.version.toString().contains("alpha") ? "snapshots" : "releases"
			url = "https://moehreag.duckdns.org/maven/" + repository
			credentials(PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}
